<script src="js/main.js"></script>
<script>
  var photos = [
    "ektar100",
    "tsp_fab_roll-2_63",
    "ektar100-2",
    "landscape",
    "ektar100-6",
    "tsp_fab_roll-2_65",
    "000722580009",
    "ektar100-9",
    "tsp_fab_roll-2_72",
    "tower"
  ];
  var grid = document.getElementById("film-gallery");
  photos.forEach(function (name) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("data-lightbox", "images/film/web/" + name + ".jpg");
    var img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "Film photograph";
    img.src = "images/film/thumb/" + name + ".jpg";
    btn.appendChild(img);
    grid.appendChild(btn);
  });
</script>
