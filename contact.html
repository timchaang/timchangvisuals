<header class="contact-hero">
  <div class="contact-bg-letters" aria-hidden="true"></div>
  <div class="contact-bg-letters contact-bg-letters-glow" aria-hidden="true"></div>
  <div class="wrap contact-inner">
    <p class="case-eyebrow reveal">Say Hello</p>
    <h1 class="case-title reveal" style="font-size:clamp(34px,6vw,64px)">Get in Touch</h1>

    <div class="contact-grid">
      <form id="contact-form" class="reveal" novalidate>
        <div class="field">
          <label for="name">Name <span aria-hidden="true">*</span></label>
          <input type="text" id="name" name="name" required />
          <p class="field-error">Please enter your name.</p>
        </div>
        <div class="field">
          <label for="email">Email <span aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" required />
          <p class="field-error">Please enter a valid email address.</p>
        </div>
        <div class="field">
          <label for="subject">Subject <span aria-hidden="true">*</span></label>
          <input type="text" id="subject" name="subject" required />
          <p class="field-error">Please enter a subject.</p>
        </div>
        <div class="field">
          <label for="message">Message <span aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="5" required></textarea>
          <p class="field-error">Please enter a message.</p>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-accent">
            Submit
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <a href="https://drive.google.com/file/d/163rN9_kF5eBWDZHMXtuJeaHaZzYS9CJe/view?usp=sharing" target="_blank" rel="noopener" class="btn">
            View Resume
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
        <p class="form-status" role="status"></p>
      </form>

      <div class="contact-side reveal">
        <p class="contact-note">Let's connect. I usually respond within a day or two.</p>
      </div>
    </div>
  </div>
</header>
